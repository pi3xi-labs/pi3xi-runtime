[project]
name = "pi3xi-audit"
version = "0.1.0"
description = "Pi³XI F.2 Audit Package v0.1: byte-level fixity checks for F.1 Canonical Records (draft)"
requires-python = ">=3.11"
license = { text = "CC0-1.0" }
dependencies = ["jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
